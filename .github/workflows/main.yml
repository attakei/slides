name: 'Continuous Integration'

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_NO_SYNC: 1
  TASK_X_REMOTE_TASKFILES: 1

jobs:
  try-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Build site contents
        run: |
          task --yes build-dirrevealjs build-dirhtml
  lint-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Check sources
        run: |
          task --yes verify
