name: 'Continuous Integration'

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_NO_SYNC: 1
  TASK_X_REMOTE_TASKFILES: 1

jobs:
  try-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Build site contents
        run: |
          task --yes build-dirrevealjs build-dirhtml
  lint-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Check sources
        run: |
          task --yes verify
