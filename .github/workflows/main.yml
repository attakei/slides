name: 'Continuous Integration'

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_NO_SYNC: 1
  TASK_X_REMOTE_TASKFILES: 1

jobs:
  try-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Build site contents
        run: |
          task --yes build-dirrevealjs build-dirhtml
  lint-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.51.2
      - name: Setup workspace
        run: |
          task --yes setup
      - name: Check sources
        run: |
          task --yes verify
